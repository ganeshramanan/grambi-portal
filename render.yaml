services:
  - type: web
    name: grambi-portal
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: sed -i 's/provider = "sqlite"/provider = "postgresql"/g' prisma/schema.prisma && npm install && npx prisma generate && npm run build
    startCommand: sed -i 's/provider = "sqlite"/provider = "postgresql"/g' prisma/schema.prisma && npx prisma db push && node dist/index.js
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: grambi-unified-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: grambi-redis
          property: connectionString

  - type: redis
    name: grambi-redis
    plan: free
    ipAllowList: []

databases:
  - name: grambi-unified-db
    plan: free
    ipAllowList: []
