<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grambi — WhatsApp Broadcast Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <script src="/theme.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/pwa-install.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-emerald-500 text-slate-950 flex items-center justify-center font-bold text-lg">
          <i class="ri-whatsapp-line"></i>
        </div>
        <span class="font-bold text-base">WhatsApp Broadcast Engine</span>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="openSettingsModal()" class="px-3 py-1.5 text-xs border border-slate-800 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-lg flex items-center gap-1.5 transition">
          <i class="ri-settings-4-line text-blue-400"></i> API Settings
        </button>
        <span id="userBadge" class="text-xs text-slate-400 px-2.5 py-1 bg-slate-900 rounded-lg border border-slate-800">Loading...</span>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left: Broadcast Sender Form (7 Cols) -->
    <div class="lg:col-span-7 space-y-6">
      <div class="p-6 rounded-2xl border border-slate-800 bg-slate-900/50 space-y-5">
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="ri-send-plane-line text-emerald-400"></i> New WhatsApp Broadcast
          </h2>
          <span class="text-xs text-emerald-400 font-mono bg-emerald-500/10 px-2.5 py-0.5 rounded border border-emerald-500/20">Meta Cloud API</span>
        </div>

        <form onsubmit="handleSendBroadcast(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Campaign Title</label>
            <input type="text" id="campName" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="e.g. Festival Offer / Periodic Maintenance Reminder" />
          </div>

          <!-- Template Select Dropdown & Language -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="block text-xs font-semibold text-slate-300">Meta Approved Template</label>
                <button type="button" onclick="fetchTemplates()" class="text-[10px] text-emerald-400 hover:underline">Sync Templates</button>
              </div>
              <select id="campTemplate" onchange="handleTemplateChange(this.value)" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs font-mono text-white focus:outline-none focus:border-emerald-500 cursor-pointer">
                <option value="hello_world" data-lang="en_US">hello_world (en_US)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Language Code</label>
              <input type="text" id="campLang" value="en_US" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs font-mono text-white focus:outline-none focus:border-emerald-500" />
            </div>
          </div>

          <!-- CSV Upload & Manual Entry -->
          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="block text-xs font-semibold text-slate-300">Recipient Phone Numbers</label>
              <div class="flex items-center gap-2">
                <label class="cursor-pointer text-[11px] text-emerald-400 hover:underline flex items-center gap-1">
                  <i class="ri-file-upload-line"></i> Upload CSV
                  <input type="file" id="csvFileInput" accept=".csv,.txt" onchange="handleCSVUpload(event)" class="hidden" />
                </label>
                <span id="recipientCountBadge" class="text-[11px] text-slate-400 bg-slate-900 px-2 py-0.5 rounded border border-slate-800">0 recipients</span>
              </div>
            </div>
            <textarea id="campRecipients" rows="6" oninput="updateRecipientCount()" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="919876543210&#10;919999988888&#10;918888877777"></textarea>
            <p class="text-[11px] text-slate-500 mt-1">Enter numbers with country code (e.g. 91 for India) without '+' or upload a contact CSV file.</p>
          </div>

          <div id="broadcastStatus" class="text-xs hidden"></div>

          <button type="submit" id="sendBtn" class="w-full py-3 bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-bold rounded-xl text-sm flex items-center justify-center gap-2 transition shadow-lg shadow-emerald-500/20">
            <i class="ri-rocket-line"></i> Launch Broadcast Campaign
          </button>
        </form>
      </div>
    </div>

    <!-- Right: Recent Campaign History & Analytics (5 Cols) -->
    <div class="lg:col-span-5 space-y-6">
      <div class="p-6 rounded-2xl border border-slate-800 bg-slate-900/50 flex flex-col h-full">
        <div class="flex items-center justify-between border-b border-slate-800/80 pb-3 mb-4">
          <div class="flex items-center gap-2.5">
            <input type="checkbox" id="selectAllCampaigns" onchange="toggleSelectAllCampaigns(this)" class="rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-0 cursor-pointer w-3.5 h-3.5" title="Select All Reports" />
            <h3 class="text-base font-bold text-white flex items-center gap-1.5">
              <i class="ri-history-line text-slate-400"></i> Broadcast Reports
            </h3>
          </div>
          <div class="flex items-center gap-2">
            <button id="btnBulkDeleteCampaigns" onclick="deleteSelectedCampaigns()" class="hidden px-2.5 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-lg text-xs font-bold transition flex items-center gap-1">
              <i class="ri-delete-bin-line"></i> Delete (<span id="selectedCampaignsCount">0</span>)
            </button>
            <button onclick="loadCampaigns()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
              <i class="ri-refresh-line"></i> Refresh
            </button>
          </div>
        </div>

        <div id="campaignList" class="space-y-3 overflow-y-auto max-h-[550px] flex-grow pr-1">
          <div class="text-center py-10 text-xs text-slate-500">Loading campaign analytics...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Settings Modal (Phone ID / Token) -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative">
      <button onclick="closeSettingsModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white">
        <i class="ri-close-line text-xl"></i>
      </button>

      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-xl">
          <i class="ri-key-2-line"></i>
        </div>
        <div>
          <h3 class="text-lg font-bold text-white">Meta API Credentials</h3>
          <p class="text-xs text-slate-400">Stored directly in your Grambi profile</p>
        </div>
      </div>

      <form onsubmit="handleSaveSettings(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">WhatsApp Phone Number ID</label>
          <input type="text" id="cfgPhoneId" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-xs font-mono text-white focus:outline-none focus:border-emerald-500" placeholder="e.g. 1278829868653290" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">WhatsApp Business Account (WABA) ID</label>
          <input type="text" id="cfgWabaId" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-xs font-mono text-white focus:outline-none focus:border-emerald-500" placeholder="e.g. 1063255519739985" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Permanent Meta Access Token</label>
          <textarea id="cfgToken" rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono text-white focus:outline-none focus:border-emerald-500" placeholder="EAAYoY..."></textarea>
        </div>

        <div id="cfgMsg" class="text-xs hidden"></div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeSettingsModal()" class="px-4 py-2 text-xs text-slate-400 hover:text-white border border-slate-800 rounded-lg">
            Cancel
          </button>
          <button type="submit" class="px-5 py-2 text-xs bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-bold rounded-lg transition">
            Save Settings
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
    function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }
    function openSandboxModal() { document.getElementById('sandboxModal').classList.remove('hidden'); }
    function closeSandboxModal() { document.getElementById('sandboxModal').classList.add('hidden'); }

    function updateRecipientCount() {
      const text = document.getElementById('campRecipients').value.trim();
      const count = text ? text.split('\n').filter(s => s.trim().length > 0).length : 0;
      document.getElementById('recipientCountBadge').innerText = `${count} recipient${count === 1 ? '' : 's'}`;
    }

    function handleCSVUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const text = event.target.result;
        // Extract phone numbers (digits of length 10-15)
        const extracted = text.split(/[\r\n,;]+/)
          .map(s => s.replace(/\D/g, '').trim())
          .filter(s => s.length >= 10 && s.length <= 15);

        const uniqueNumbers = Array.from(new Set(extracted));
        document.getElementById('campRecipients').value = uniqueNumbers.join('\n');
        updateRecipientCount();
      };
      reader.readAsText(file);
    }

    let fetchedTemplatesList = [];

    function handleTemplateChange(templateName) {
      const selected = fetchedTemplatesList.find(t => t.name === templateName);
      if (selected && selected.language) {
        document.getElementById('campLang').value = selected.language;
      }
    }

    async function fetchTemplates() {
      const btn = document.querySelector('button[onclick="fetchTemplates()"]');
      if (btn) btn.innerText = 'Syncing...';

      try {
        const token = localStorage.getItem('grambi_token');
        const res = await fetch('/api/whatsapp/templates', {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        });
        const data = await res.json();
        if (data.templates && data.templates.length > 0) {
          fetchedTemplatesList = data.templates;
          const select = document.getElementById('campTemplate');
          select.innerHTML = data.templates.map(t => `
            <option value="${t.name}" data-lang="${t.language || 'en_US'}">
              ${t.name} (${t.language || 'en_US'}) — ${t.status || 'APPROVED'}
            </option>
          `).join('');

          // Auto update language code to match first selected template
          if (data.templates[0]?.language) {
            document.getElementById('campLang').value = data.templates[0].language;
          }

          if (btn) btn.innerText = `Synced (${data.templates.length})`;
        } else if (data.error) {
          if (btn) btn.innerText = 'Sync Failed';
          alert('Meta Template Sync: ' + data.error);
        } else {
          if (btn) btn.innerText = '0 Templates';
        }
      } catch (e) {
        if (btn) btn.innerText = 'Sync Templates';
      }
    }

    async function initApp() {
      const token = localStorage.getItem('grambi_token');
      try {
        const res = await fetch('/api/auth/me', {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        });
        if (!res.ok) throw new Error();
        const user = await res.json();
        document.getElementById('userBadge').innerText = user.businessName || user.email;

        // Pre-fill settings modal
        if (user.phoneNumberId) document.getElementById('cfgPhoneId').value = user.phoneNumberId;
        if (user.wabaId) document.getElementById('cfgWabaId').value = user.wabaId;

        loadCampaigns();
        fetchTemplates();
      } catch (e) {
        window.location.href = '/index.html';
      }
    }

    async function handleSaveSettings(e) {
      e.preventDefault();
      const phoneNumberId = document.getElementById('cfgPhoneId').value.trim();
      const wabaId = document.getElementById('cfgWabaId').value.trim();
      const accessToken = document.getElementById('cfgToken').value.trim();
      const msg = document.getElementById('cfgMsg');

      try {
        const res = await fetch('/api/auth/credentials', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phoneNumberId, wabaId, accessToken })
        });
        if (!res.ok) throw new Error('Failed to update credentials');

        msg.className = "text-xs text-emerald-400 block";
        msg.innerText = "Settings saved successfully!";
        setTimeout(() => closeSettingsModal(), 1200);
      } catch (err) {
        msg.className = "text-xs text-rose-400 block";
        msg.innerText = err.message;
      }
    }

    async function handleSendBroadcast(e) {
      e.preventDefault();
      const campaignName = document.getElementById('campName').value.trim();
      const templateName = document.getElementById('campTemplate').value.trim();
      const languageCode = document.getElementById('campLang').value.trim();
      const rawRecipients = document.getElementById('campRecipients').value.trim();
      const recipients = rawRecipients.split('\n').map(s => s.trim()).filter(s => s.length > 0);
      const statusEl = document.getElementById('broadcastStatus');
      const btn = document.getElementById('sendBtn');

      btn.disabled = true;
      btn.innerText = 'Dispatching Broadcast...';

      try {
        const res = await fetch('/api/whatsapp/broadcast', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ campaignName, templateName, languageCode, recipients })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to dispatch campaign');

        statusEl.className = "text-xs text-emerald-400 block p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl";
        statusEl.innerText = `✅ ${data.message}`;
        document.getElementById('campRecipients').value = '';
        updateRecipientCount();
        loadCampaigns();
      } catch (err) {
        statusEl.className = "text-xs text-rose-400 block p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl";
        statusEl.innerText = `❌ ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="ri-rocket-line"></i> Launch Broadcast Campaign';
      }
    }

    let selectedCampaignIds = new Set();

    function updateBulkDeleteUI() {
      const count = selectedCampaignIds.size;
      const btn = document.getElementById('btnBulkDeleteCampaigns');
      const countEl = document.getElementById('selectedCampaignsCount');
      const selectAll = document.getElementById('selectAllCampaigns');

      if (countEl) countEl.innerText = count;
      if (btn) {
        if (count > 0) {
          btn.classList.remove('hidden');
        } else {
          btn.classList.add('hidden');
        }
      }

      const allBoxes = document.querySelectorAll('.campaign-checkbox');
      if (selectAll && allBoxes.length > 0) {
        selectAll.checked = allBoxes.length === count;
        selectAll.indeterminate = count > 0 && count < allBoxes.length;
      } else if (selectAll) {
        selectAll.checked = false;
        selectAll.indeterminate = false;
      }
    }

    function toggleSelectCampaign(checkbox, id) {
      if (checkbox.checked) {
        selectedCampaignIds.add(id);
      } else {
        selectedCampaignIds.delete(id);
      }
      updateBulkDeleteUI();
    }

    function toggleSelectAllCampaigns(masterCheckbox) {
      const allBoxes = document.querySelectorAll('.campaign-checkbox');
      allBoxes.forEach(cb => {
        cb.checked = masterCheckbox.checked;
        if (masterCheckbox.checked) {
          selectedCampaignIds.add(cb.value);
        } else {
          selectedCampaignIds.delete(cb.value);
        }
      });
      updateBulkDeleteUI();
    }

    async function loadCampaigns() {
      try {
        const token = localStorage.getItem('grambi_token');
        const res = await fetch('/api/whatsapp/campaigns', {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        });
        const data = await res.json();
        const list = document.getElementById('campaignList');

        if (!data.campaigns || data.campaigns.length === 0) {
          selectedCampaignIds.clear();
          updateBulkDeleteUI();
          list.innerHTML = '<div class="text-center py-10 text-xs text-slate-500">No campaigns sent yet.</div>';
          return;
        }

        // Clean up any stale IDs from previous loads
        const currentIds = new Set(data.campaigns.map(c => c.id));
        for (const id of selectedCampaignIds) {
          if (!currentIds.has(id)) selectedCampaignIds.delete(id);
        }

        list.innerHTML = data.campaigns.map(c => {
          const dateStr = c.createdAt 
            ? new Date(c.createdAt).toLocaleString(undefined, { 
                day: '2-digit', 
                month: 'short', 
                year: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                hour12: true 
              })
            : '';

          const isChecked = selectedCampaignIds.has(c.id);

          return `
          <div class="p-4 rounded-xl border border-slate-800 bg-slate-950/60 space-y-2.5">
            <div class="flex justify-between items-start gap-2">
              <div class="flex items-start gap-2.5 min-w-0">
                <input type="checkbox" value="${c.id}" onchange="toggleSelectCampaign(this, '${c.id}')" ${isChecked ? 'checked' : ''} class="campaign-checkbox mt-0.5 rounded bg-slate-900 border-slate-700 text-emerald-500 focus:ring-0 cursor-pointer w-3.5 h-3.5 shrink-0" />
                <div class="min-w-0">
                  <span class="font-bold text-white text-xs block truncate max-w-[190px]">${c.name}</span>
                  ${dateStr ? `<span class="text-[10px] text-slate-400 flex items-center gap-1 mt-0.5"><i class="ri-time-line text-slate-500"></i> ${dateStr}</span>` : ''}
                </div>
              </div>
              <div class="flex items-center gap-2.5 shrink-0 ml-2">
                <a href="/api/whatsapp/campaigns/${c.id}/export" class="text-[10px] text-emerald-400 hover:underline flex items-center gap-1">
                  <i class="ri-download-2-line"></i> Export CSV
                </a>
                <button type="button" onclick="deleteCampaign('${c.id}', '${(c.name || '').replace(/'/g, "\\'")}')" class="text-[10px] text-rose-400 hover:text-rose-300 hover:underline flex items-center gap-0.5" title="Delete Broadcast Report">
                  <i class="ri-delete-bin-line"></i> Delete
                </button>
              </div>
            </div>
            <div class="flex flex-wrap gap-2 text-[11px] pl-6">
              <span class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-mono">${c.templateName}</span>
              <span class="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">${c.stats.sent} Sent</span>
              ${c.stats.delivered ? `<span class="px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20">${c.stats.delivered} Delivered</span>` : ''}
              ${c.stats.failed ? `<span class="px-2 py-0.5 rounded bg-rose-500/10 text-rose-400 border border-rose-500/20">${c.stats.failed} Failed</span>` : ''}
            </div>
          </div>
        `;
        }).join('');

        updateBulkDeleteUI();
      } catch (e) {}
    }

    async function deleteCampaign(campaignId, campaignName) {
      if (!confirm(`Are you sure you want to delete the broadcast report for "${campaignName || 'this campaign'}"? This action cannot be undone.`)) {
        return;
      }

      try {
        const token = localStorage.getItem('grambi_token');
        const res = await fetch(`/api/whatsapp/campaigns/${encodeURIComponent(campaignId)}`, {
          method: 'DELETE',
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to delete campaign');

        selectedCampaignIds.delete(campaignId);
        updateBulkDeleteUI();
        loadCampaigns();
      } catch (err) {
        alert(`❌ ${err.message}`);
      }
    }

    async function deleteSelectedCampaigns() {
      const count = selectedCampaignIds.size;
      if (count === 0) return;

      if (!confirm(`Are you sure you want to delete ${count} selected broadcast report(s)? This action cannot be undone.`)) {
        return;
      }

      const btn = document.getElementById('btnBulkDeleteCampaigns');
      if (btn) {
        btn.disabled = true;
        btn.innerText = 'Deleting...';
      }

      try {
        const token = localStorage.getItem('grambi_token');
        const res = await fetch('/api/whatsapp/campaigns/batch-delete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
          },
          body: JSON.stringify({ ids: Array.from(selectedCampaignIds) })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to delete selected reports');

        selectedCampaignIds.clear();
        updateBulkDeleteUI();
        loadCampaigns();
      } catch (err) {
        alert(`❌ ${err.message}`);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<i class="ri-delete-bin-line"></i> Delete (<span id="selectedCampaignsCount">0</span>)`;
        }
      }
    }

    initApp();
    setInterval(loadCampaigns, 6000);
  </script>
</body>
</html>
