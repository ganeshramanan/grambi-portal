<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Grambi.in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <script src="/theme.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl relative">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white text-xl shadow-lg shadow-blue-500/20">
        G
      </div>
      <div>
        <h1 class="text-xl font-bold text-white">Grambi<span class="text-blue-500">.in</span></h1>
        <p class="text-xs text-slate-400">Account Password Reset</p>
      </div>
    </div>

    <div id="statusAlert" class="hidden mb-4 p-3 rounded-lg text-xs leading-relaxed"></div>

    <form id="resetForm" onsubmit="handleResetPassword(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
        <input type="email" id="resetEmail" required readonly class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-400 cursor-not-allowed" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">New Password</label>
        <input type="password" id="newPassword" required minlength="6" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="Minimum 6 characters" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Confirm New Password</label>
        <input type="password" id="confirmPassword" required minlength="6" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="Re-enter password" />
      </div>

      <button type="submit" id="submitBtn" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition shadow-md shadow-blue-500/20">
        Update Password
      </button>

      <div class="text-center pt-2">
        <a href="/index.html" class="text-xs text-slate-400 hover:text-white transition">
          ← Back to Sign In
        </a>
      </div>
    </form>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token') || '';
    const email = urlParams.get('email') || '';

    const emailInput = document.getElementById('resetEmail');
    const alertBox = document.getElementById('statusAlert');
    const submitBtn = document.getElementById('submitBtn');

    if (email) {
      emailInput.value = email;
    }

    if (!token) {
      alertBox.className = 'block mb-4 p-3 rounded-lg text-xs leading-relaxed bg-rose-500/10 border border-rose-500/30 text-rose-400';
      alertBox.innerText = 'Missing or invalid password reset token. Please request a new link from the sign-in page.';
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        alertBox.className = 'block mb-4 p-3 rounded-lg text-xs leading-relaxed bg-rose-500/10 border border-rose-500/30 text-rose-400';
        alertBox.innerText = 'Passwords do not match. Please verify both fields.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Updating...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, email: emailInput.value, newPassword })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to reset password');

        alertBox.className = 'block mb-4 p-3 rounded-lg text-xs leading-relaxed bg-emerald-500/10 border border-emerald-500/30 text-emerald-400';
        alertBox.innerText = data.message || 'Password successfully updated! Redirecting to sign in...';

        setTimeout(() => {
          window.location.href = '/index.html';
        }, 2500);
      } catch (err) {
        alertBox.className = 'block mb-4 p-3 rounded-lg text-xs leading-relaxed bg-rose-500/10 border border-rose-500/30 text-rose-400';
        alertBox.innerText = err.message;
        submitBtn.disabled = false;
        submitBtn.innerText = 'Update Password';
      }
    }
  </script>
</body>
</html>
