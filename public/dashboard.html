<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grambi Portal — Launch Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-emerald-400 text-slate-950 flex items-center justify-center font-bold">G</div>
        <span class="font-bold text-lg">Grambi Launchpad</span>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-right">
          <div id="userName" class="text-sm font-semibold text-white">Loading...</div>
          <div id="userRole" class="text-xs text-slate-400 capitalize">Member</div>
        </div>
        <a id="adminLink" href="/admin.html" class="hidden px-3 py-1.5 text-xs bg-purple-500/20 border border-purple-500/40 text-purple-300 rounded-lg hover:bg-purple-500/30">
          Admin Panel
        </a>
        <button onclick="handleLogout()" class="text-slate-400 hover:text-white text-sm px-3 py-1.5 border border-slate-800 rounded-lg hover:bg-slate-800">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full">
    <div class="mb-10">
      <h1 class="text-3xl font-bold text-white mb-2">Your Applications</h1>
      <p class="text-slate-400 text-sm">Select an application below to securely launch it on Render.</p>
    </div>

    <!-- Dynamic Product Launch Cards -->
    <div id="productCards" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <!-- Product Configuration Modal (WhatsApp Phone ID & Token, etc.) -->
  <div id="configModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative">
      <button onclick="closeConfigModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white">
        <i class="ri-close-line text-xl"></i>
      </button>

      <div class="flex items-center gap-3 mb-2">
        <div id="modalProductIcon" class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 text-xl">
          <i class="ri-settings-3-line"></i>
        </div>
        <div>
          <h3 id="modalProductTitle" class="text-xl font-bold text-white">Product Configuration</h3>
          <p class="text-xs text-slate-400">Configure your specific API credentials</p>
        </div>
      </div>

      <div id="configFormContainer" class="mt-6">
        <!-- Dynamically generated fields based on product -->
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;

    function getAuthHeaders() {
      const token = localStorage.getItem('grambi_token');
      return token ? { 'Authorization': `Bearer ${token}` } : {};
    }

    async function loadDashboard() {
      try {
        const res = await fetch('/api/auth/me', {
          headers: {
            'Accept': 'application/json',
            ...getAuthHeaders()
          }
        });

        if (!res.ok) {
          window.location.href = '/index.html';
          return;
        }

        const contentType = res.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          window.location.href = '/index.html';
          return;
        }

        const data = await res.json();
        currentUser = data.user;
        document.getElementById('userName').innerText = currentUser.name;
        document.getElementById('userRole').innerText = currentUser.role === 'admin' ? 'Super Admin' : 'Customer Account';

        if (currentUser.role === 'admin') {
          document.getElementById('adminLink').classList.remove('hidden');
        }

        renderProducts(data.products, currentUser);
      } catch (err) {
        window.location.href = '/index.html';
      }
    }

    function renderProducts(products, user) {
      const container = document.getElementById('productCards');
      container.innerHTML = '';

      products.forEach(prod => {
        const hasAccess = user.role === 'admin' || (user.allowedProducts && user.allowedProducts.includes(prod.key));

        const card = document.createElement('div');
        card.className = `p-6 rounded-2xl border ${hasAccess ? 'border-slate-800 bg-slate-900/60' : 'border-slate-800/40 bg-slate-900/20 opacity-75'} flex flex-col justify-between`;

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-4">
              <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-2xl text-emerald-400">
                <i class="${prod.icon || 'ri-apps-line'}"></i>
              </div>
              <span class="text-xs px-2.5 py-1 rounded-full ${hasAccess ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-slate-800 text-slate-400'}">
                ${hasAccess ? 'Active Access' : 'Locked'}
              </span>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">${prod.name}</h3>
            <p class="text-xs text-slate-400 leading-relaxed mb-6">${prod.description}</p>
          </div>

          <div class="space-y-2">
            ${hasAccess 
              ? `
                <div class="flex gap-2">
                  <button onclick="openConfigModal('${prod.key}', '${prod.name}')" class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-xs flex items-center justify-center gap-1 transition" title="Configure API Keys / Credentials">
                    <i class="ri-settings-4-line"></i> Credentials
                  </button>
                  <button onclick="launchApp('${prod.key}')" class="flex-1 py-2.5 px-4 bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-bold rounded-xl text-sm flex items-center justify-center gap-2 transition">
                    Launch App <i class="ri-arrow-right-up-line"></i>
                  </button>
                </div>`
              : `<button disabled class="w-full py-2.5 px-4 bg-slate-800 text-slate-500 font-semibold rounded-xl text-sm cursor-not-allowed">
                   Contact Admin for Access
                 </button>`
            }
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Modal & Product Schema configuration
    const PRODUCT_SCHEMAS = {
      whatsapp_automator: {
        title: 'WhatsApp Business API Settings',
        fields: [
          { key: 'phone_number_id', label: 'WhatsApp Phone Number ID', type: 'text', placeholder: 'e.g. 10482938291039' },
          { key: 'waba_id', label: 'WhatsApp Business Account (WABA) ID', type: 'text', placeholder: 'e.g. 29384910294829' },
          { key: 'access_token', label: 'Permanent / System Access Token', type: 'password', placeholder: 'EAABw...' }
        ]
      },
      website_builder: {
        title: 'Website Portal Settings',
        fields: [
          { key: 'custom_domain', label: 'Custom Domain / Subdomain', type: 'text', placeholder: 'e.g. portal.mybrand.com' },
          { key: 'api_key', label: 'Website Management API Key', type: 'password', placeholder: 'sk_live_...' }
        ]
      }
    };

    let activeModalProductKey = null;

    async function openConfigModal(productKey, productName) {
      activeModalProductKey = productKey;
      document.getElementById('modalProductTitle').innerText = `${productName} Credentials`;
      document.getElementById('configModal').classList.remove('hidden');

      // Fetch saved settings
      let savedConfig = {};
      try {
        const res = await fetch(`/api/user/config/${productKey}`, {
          headers: {
            'Accept': 'application/json',
            ...getAuthHeaders()
          }
        });
        if (res.ok) {
          const data = await res.json();
          savedConfig = data.config || {};
        }
      } catch (e) {}

      // Fallback schema if custom product
      const schema = PRODUCT_SCHEMAS[productKey] || {
        title: `${productName} Settings`,
        fields: [
          { key: 'api_key', label: 'API Key / Access Token', type: 'password', placeholder: 'Enter access token' },
          { key: 'account_id', label: 'Account / Project ID', type: 'text', placeholder: 'Enter Account ID' }
        ]
      };

      const formContainer = document.getElementById('configFormContainer');
      formContainer.innerHTML = `
        <form onsubmit="handleSaveConfig(event)" class="space-y-4">
          ${schema.fields.map(f => `
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">${f.label}</label>
              <input type="${f.type}" id="cfg_${f.key}" value="${savedConfig[f.key] || ''}" 
                class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" 
                placeholder="${f.placeholder}" />
            </div>
          `).join('')}

          <div id="configSaveMsg" class="text-xs hidden"></div>

          <div class="pt-2 flex justify-end gap-3">
            <button type="button" onclick="closeConfigModal()" class="px-4 py-2 text-xs text-slate-400 hover:text-white border border-slate-800 rounded-lg">
              Cancel
            </button>
            <button type="submit" class="px-5 py-2 text-xs bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-bold rounded-lg transition">
              Save Credentials
            </button>
          </div>
        </form>
      `;
    }

    function closeConfigModal() {
      document.getElementById('configModal').classList.add('hidden');
    }

    async function handleSaveConfig(e) {
      e.preventDefault();
      const schema = PRODUCT_SCHEMAS[activeModalProductKey] || {
        fields: [{ key: 'api_key' }, { key: 'account_id' }]
      };

      const config = {};
      schema.fields.forEach(f => {
        const input = document.getElementById(`cfg_${f.key}`);
        if (input) config[f.key] = input.value.trim();
      });

      const msgEl = document.getElementById('configSaveMsg');
      try {
        const res = await fetch(`/api/user/config/${activeModalProductKey}`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            ...getAuthHeaders()
          },
          body: JSON.stringify({ config })
        });

        const contentType = res.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to save');
        } else {
          const text = await res.text();
          if (!res.ok) throw new Error(`Server returned HTTP ${res.status}: ${text.slice(0, 80)}`);
        }

        msgEl.className = "text-xs text-emerald-400 block";
        msgEl.innerText = "Credentials saved! They will be automatically passed when launching.";
        setTimeout(() => closeConfigModal(), 1500);
      } catch (err) {
        msgEl.className = "text-xs text-rose-400 block";
        msgEl.innerText = err.message;
      }
    }

    async function launchApp(productKey) {
      try {
        const res = await fetch(`/api/products/launch/${productKey}`, {
          headers: { 
            'Accept': 'application/json',
            ...getAuthHeaders()
          }
        });

        const contentType = res.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to launch');
          // Open the Render Application in a new tab with the generated SSO Token
          window.open(data.launchUrl, '_blank');
        } else {
          const text = await res.text();
          throw new Error(`Server returned HTTP ${res.status}: ${text.slice(0, 80)}`);
        }
      } catch (err) {
        alert(err.message);
      }
    }

    async function handleLogout() {
      localStorage.removeItem('grambi_token');
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/index.html';
    }

    loadDashboard();
  </script>
</body>
</html>
