<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grambi Admin — Customer Product Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <script src="/theme.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-purple-500 text-white flex items-center justify-center font-bold">A</div>
        <span class="font-bold text-lg">Grambi Super Admin Hub</span>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="toggleTheme()" class="p-1.5 text-slate-400 hover:text-white border border-slate-800 rounded-lg hover:bg-slate-800 transition" title="Toggle Theme">
          <i id="themeToggleIcon" class="ri-sun-line text-amber-400"></i>
        </button>
        <a href="/portal.html" class="text-xs text-slate-400 hover:text-white px-3 py-1.5 border border-slate-800 rounded-lg">
          ← Back to Launchpad
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-white">Customer Product Permissions</h1>
      <p class="text-sm text-slate-400">Approve new signups and toggle which products each customer can access.</p>
    </div>

    <!-- Users Table -->
    <div class="border border-slate-800 bg-slate-900/40 rounded-2xl overflow-hidden shadow-xl">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-900 border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
          <tr>
            <th class="px-6 py-4">Customer</th>
            <th class="px-6 py-4">Phone / Contact</th>
            <th class="px-6 py-4">Account Status</th>
            <th class="px-6 py-4">Product Subscriptions</th>
            <th class="px-6 py-4 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody" class="divide-y divide-slate-800/60">
          <!-- Dynamically filled -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    async function loadAdmin() {
      try {
        const token = localStorage.getItem('grambi_token');
        const res = await fetch('/api/admin/users', {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        });

        if (!res.ok) {
          window.location.href = '/portal.html';
          return;
        }

        const data = await res.json();
        renderUsers(data.users || []);
      } catch (err) {
        alert('Failed to load admin panel');
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';

      users.forEach(u => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/30 transition';

        const statusBadge = u.status === 'APPROVED' 
          ? '<span class="px-2.5 py-1 text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full">Approved</span>'
          : u.status === 'PENDING'
          ? '<span class="px-2.5 py-1 text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-full">Pending Approval</span>'
          : '<span class="px-2.5 py-1 text-xs bg-rose-500/10 text-rose-400 border border-rose-500/30 rounded-full">Rejected</span>';

        const subs = (u.subscriptions || []).map(s => s.productKey);

        const waChecked = subs.includes('WHATSAPP_BROADCAST') ? 'checked' : '';
        const wbChecked = subs.includes('WEBSITE_BUILDER') ? 'checked' : '';

        tr.innerHTML = `
          <td class="px-6 py-4">
            <div class="font-semibold text-white">${u.businessName || u.email}</div>
            <div class="text-xs text-slate-500">${u.email}</div>
          </td>
          <td class="px-6 py-4 text-xs text-slate-300">${u.phone || 'N/A'}</td>
          <td class="px-6 py-4">${statusBadge}</td>
          <td class="px-6 py-4 space-x-3">
            <label class="inline-flex items-center gap-1.5 text-xs cursor-pointer">
              <input type="checkbox" ${waChecked} onchange="toggleAccess('${u.id}', 'WHATSAPP_BROADCAST', this.checked)" class="rounded bg-slate-950 border-slate-700 text-emerald-500">
              <span class="text-slate-300">WhatsApp</span>
            </label>
            <label class="inline-flex items-center gap-1.5 text-xs cursor-pointer">
              <input type="checkbox" ${wbChecked} onchange="toggleAccess('${u.id}', 'WEBSITE_BUILDER', this.checked)" class="rounded bg-slate-950 border-slate-700 text-blue-500">
              <span class="text-slate-300">Website Customizer</span>
            </label>
          </td>
          <td class="px-6 py-4 text-right space-x-2">
            ${u.status === 'PENDING' ? `
              <button onclick="updateStatus('${u.id}', 'APPROVED')" class="px-3 py-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs rounded-lg">Approve</button>
              <button onclick="updateStatus('${u.id}', 'REJECTED')" class="px-3 py-1 bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 text-xs rounded-lg">Reject</button>
            ` : `
              <button onclick="deleteCustomer('${u.id}', '${u.businessName || u.email}')" class="px-2.5 py-1 text-xs text-rose-400 hover:text-rose-300 hover:bg-rose-500/20 rounded-lg transition" title="Delete customer">
                <i class="ri-delete-bin-line"></i> Delete
              </button>
            `}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function updateStatus(id, status) {
      await fetch(`/api/admin/users/${id}/access`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadAdmin();
    }

    async function toggleAccess(id, productKey, isChecked) {
      const res = await fetch('/api/admin/users');
      const data = await res.json();
      const user = data.users.find(u => u.id === id);
      let subs = new Set((user.subscriptions || []).map(s => s.productKey));

      if (isChecked) subs.add(productKey);
      else subs.delete(productKey);

      await fetch(`/api/admin/users/${id}/access`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ allowedProducts: Array.from(subs) })
      });
      loadAdmin();
    }

    async function deleteCustomer(id, name) {
      if (!confirm(`Are you sure you want to delete customer "${name}"?`)) return;
      await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
      loadAdmin();
    }

    loadAdmin();
  </script>
</body>
</html>
