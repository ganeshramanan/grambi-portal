<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grambi Launchpad — Select Application</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Grambi" />
  <script src="/theme.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/pwa-install.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold">G</div>
        <span class="font-bold text-lg">Grambi Launchpad</span>
      </div>

      <div class="flex items-center gap-4">
        <!-- Theme Toggle Button -->
        <button onclick="toggleTheme()" class="p-2 text-slate-400 hover:text-white border border-slate-800 rounded-lg hover:bg-slate-800 transition" title="Toggle Theme">
          <i id="themeToggleIcon" class="ri-sun-line text-amber-400"></i>
        </button>
        <div class="text-right">
          <div id="userName" class="text-sm font-semibold text-white">Loading...</div>
          <div id="userRole" class="text-xs text-slate-400 capitalize">Member</div>
        </div>
        <a id="adminLink" href="/admin.html" class="hidden px-3 py-1.5 text-xs bg-purple-500/20 border border-purple-500/40 text-purple-300 rounded-lg hover:bg-purple-500/30">
          Admin Hub
        </a>
        <button onclick="handleLogout()" class="text-slate-400 hover:text-white text-sm px-3 py-1.5 border border-slate-800 rounded-lg hover:bg-slate-800">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full">
    <div class="mb-10">
      <h1 class="text-3xl font-bold text-white mb-2">Available Products & Modules</h1>
      <p class="text-slate-400 text-sm">Select any authorized module below. Access is unified under your current session.</p>
    </div>

    <!-- Product Cards -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6" id="productGrid">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <script>
    const PRODUCTS = [
      {
        key: 'WHATSAPP_BROADCAST',
        name: 'WhatsApp Bulk Broadcaster',
        description: 'Send high-volume WhatsApp campaigns, upload contact CSVs, and inspect real-time delivery reports.',
        icon: 'ri-whatsapp-line',
        url: '/apps/whatsapp.html',
        color: 'emerald'
      },
      {
        key: 'WEBSITE_BUILDER',
        name: 'Business Website & vCard Customizer',
        description: 'Design and publish a mobile-friendly business website, showcase your products/services, and collect customer appointment leads.',
        icon: 'ri-layout-masonry-line',
        url: '/apps/website-customizer.html',
        color: 'blue'
      },
      {
        key: 'SOCIAL_GENERATOR',
        name: 'Social Media Post & Occasions Studio',
        description: 'Generate high-res social media festival posts, marketing banners, photo overlays, and calendar-synced greetings.',
        icon: 'ri-magic-line',
        url: '/apps/social-generator.html',
        color: 'pink'
      },
      {
        key: 'DIGITAL_INVOICING',
        name: 'Digital Invoicing & WhatsApp Billing',
        description: 'Create multi-industry bills, generate instant UPI scan & pay QR receipts, and dispatch professional invoices directly to customer WhatsApp.',
        icon: 'ri-bill-line',
        url: '/apps/invoices.html',
        color: 'amber'
      },
      {
        key: 'CUSTOMER_CRM',
        name: 'Universal Customer CRM & Retention Engine',
        description: 'Track periodic service cycles, insurance renewals, appointments, and dispatch 1-click personalized WhatsApp reminders.',
        icon: 'ri-user-follow-line',
        url: '/apps/crm.html',
        color: 'cyan'
      }
    ];

    async function loadPortal() {
      try {
        const token = localStorage.getItem('grambi_token');
        const res = await fetch('/api/auth/me', {
          headers: token ? { 'Authorization': `Bearer ${token}` } : {}
        });

        if (!res.ok) {
          window.location.href = '/index.html';
          return;
        }

        const user = await res.json();
        document.getElementById('userName').innerText = user.businessName || user.email;
        document.getElementById('userRole').innerText = user.role === 'ADMIN' ? 'Super Admin' : 'Customer Account';

        if (user.role === 'ADMIN') {
          document.getElementById('adminLink').classList.remove('hidden');
        }

        renderProducts(user);
      } catch (err) {
        window.location.href = '/index.html';
      }
    }

    function renderProducts(user) {
      const container = document.getElementById('productGrid');
      container.innerHTML = '';

      const authorizedProducts = PRODUCTS.filter(p => user.role === 'ADMIN' || (user.subscriptions && user.subscriptions.includes(p.key)));

      if (authorizedProducts.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center border border-dashed border-slate-800 rounded-3xl p-8 bg-slate-900/30">
            <div class="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-2xl mx-auto mb-3">
              <i class="ri-lock-2-line"></i>
            </div>
            <h3 class="text-base font-bold text-white mb-1">No Active Modules Yet</h3>
            <p class="text-xs text-slate-400 max-w-sm mx-auto">Your account is active. Please wait for the admin to enable your requested modules or reach out to support.</p>
          </div>
        `;
        return;
      }

      authorizedProducts.forEach(p => {
        const card = document.createElement('div');
        card.className = 'p-6 rounded-2xl border border-slate-800 bg-slate-900/60 hover:border-slate-700 transition flex flex-col justify-between';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-4">
              <div class="w-12 h-12 rounded-xl bg-${p.color}-500/10 text-${p.color}-400 flex items-center justify-center text-2xl border border-${p.color}-500/20">
                <i class="${p.icon}"></i>
              </div>
              <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-bold">
                Active
              </span>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">${p.name}</h3>
            <p class="text-xs text-slate-400 leading-relaxed mb-6">${p.description}</p>
          </div>

          <div>
            <a href="${p.url}" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl text-sm flex items-center justify-center gap-2 transition shadow-md shadow-blue-500/10">
              Open Application <i class="ri-arrow-right-line"></i>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function handleLogout() {
      localStorage.removeItem('grambi_token');
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/index.html';
    }

    loadPortal();
  </script>
</body>
</html>
